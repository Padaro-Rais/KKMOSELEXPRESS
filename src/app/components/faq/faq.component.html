<div class="faq-container">



  <div class="faq-list">

    <div
      class="faq-item"
      *ngFor="let item of items; let i = index"
      [class.open]="isOpen(i)"
      appScrollReveal
      [style.transitionDelay]="i * 80 + 'ms'"
    >

      <button class="faq-question" (click)="toggle(i)">
        <span>{{ item.question }}</span>

        <div class="icon" [class.rotated]="isOpen(i)">
          <i class="fa-solid fa-plus"></i>
        </div>
      </button>

      <div class="faq-answer" [class.open]="isOpen(i)">
        <p>{{ item.answer }}</p>
      </div>

    </div>

  </div>
</div>
