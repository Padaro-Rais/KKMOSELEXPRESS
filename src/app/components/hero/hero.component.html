<section class="hero">

  <!-- BACKGROUND IMAGE -->
  <div
    class="hero-bg"
    [style.transform]="'translateY(' + parallaxY + 'px)'"
  ></div>

  <!-- OVERLAY -->
  <div class="hero-overlay"></div>

  <!-- CONTENT -->
  <div class="hero-content container">

    <!-- BADGE -->
    <div class="hero-badge">
      🚚 Transport & Logistique Internationale
    </div>


    <!-- H1 PRINCIPAL -->
    <h1 class="hero-title">
      KKMOSEL EXPRESS
      <br>
      <span>Transport & Logistique au Luxembourg</span>
    </h1>


    <!-- DESCRIPTION -->
    <p class="hero-subtitle">
      Solutions de transport de marchandises rapides, fiables et sécurisées
      entre le Luxembourg, la France, la Belgique et l’Allemagne.
    </p>


    <!-- ACTIONS -->
    <div class="hero-actions">

      <a
        routerLink="/contact"
        class="btn-primary"
      >
        Demander un devis
      </a>

      <a
        routerLink="/services"
        class="btn-secondary"
      >
        Découvrir nos services
      </a>

    </div>


    <!-- STATS -->
    <!--
    <div class="hero-stats">

      <div class="stat">
        <h3>10+</h3>
        <p>Années d'expérience</p>
      </div>

      <div class="stat">
        <h3>500+</h3>
        <p>Clients satisfaits</p>
      </div>

      <div class="stat">
        <h3>2500+</h3>
        <p>Livraisons</p>
      </div>

    </div>
    -->


  </div>


  <!-- SCROLL INDICATOR -->
  <div class="scroll-indicator">

    <div class="mouse"></div>

    <span>
      Défiler
    </span>

  </div>

</section>
