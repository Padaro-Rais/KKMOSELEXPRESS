<section class="hero">

  <!-- BACKGROUND IMAGE -->
  <div
    class="hero-bg"
    [style.transform]="'translateY(' + parallaxY + 'px)'"
  ></div>

  <!-- OVERLAY -->
  <div class="hero-overlay"></div>

  <!-- CONTENT -->
  <div class="hero-content container">

    <div class="hero-badge">
      🚚 Transport & Logistique Internationale
    </div>

    <h1 class="hero-title">
      Solutions de transport <br>
      <span>rapides & sécurisées</span>
    </h1>

    <p class="hero-subtitle">
      Nous assurons le transport de marchandises entre le Luxembourg, l’Allemagne,
      la France et la Belgique avec fiabilité, rapidité et sécurité.
    </p>

    <div class="hero-actions">
      <a routerLink="/contact" class="btn-primary">
        Demander un devis
      </a>

      <a routerLink="/services" class="btn-secondary">
        Nos services
      </a>
    </div>

    <!-- STATS -->
    <!-- <div class="hero-stats">

      <div class="stat">
        <h3>10+</h3>
        <p>Années d'expérience</p>
      </div>

      <div class="stat">
        <h3>500+</h3>
        <p>Clients satisfaits</p>
      </div>

      <div class="stat">
        <h3>2500+</h3>
        <p>Livraisons</p>
      </div>

    </div> -->

  </div>

  <!-- SCROLL INDICATOR -->
  <div class="scroll-indicator">
    <div class="mouse"></div>
    <span>Défiler</span>
  </div>

</section>
